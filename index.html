<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monica's Pie - Aesthetic Calendar</title>
    <style>
        :root {
            --bg-color: transparent;
            --text-main: #37352f;
            --text-dim: #7a7a7a;
            --highlight-soft: #ede6dd;
            --highlight-today: #000;
            --font-serif: 'Georgia', serif;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-main: #ebebeb;
                --text-dim: #a0a0a0;
                --highlight-soft: #3f3e3c;
                --highlight-today: #fff;
            }
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            color: var(--text-main);
            overflow: hidden;
        }

        .split-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            width: 100%;
            max-width: 650px;
            align-items: start;
        }

        /* Left Side */
        .sidebar {
            text-align: left;
            border-right: 1px solid rgba(122, 122, 122, 0.2);
            padding-right: 25px;
        }

        .year-text {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--text-dim);
            margin: 0;
            font-family: var(--font-sans);
        }

        .month-text {
            font-family: var(--font-serif); /* Same as Quotes */
            font-size: 3.5rem;
            margin: 0px 0 25px 0;
            font-style: italic;
            font-weight: normal;
        }

        .event-list { margin-top: 10px; }

        .event-row {
            display: flex;
            gap: 15px;
            margin-bottom: 18px;
            font-size: 0.85rem;
        }

        .event-num {
            font-weight: 600;
            min-width: 20px;
        }

        .event-info { display: flex; flex-direction: column; }
        .event-name { font-weight: 500; }
        .event-tag { 
            font-size: 0.75rem; 
            color: var(--text-dim); 
            font-style: italic;
        }

        /* Right Side */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            text-align: center;
        }

        .weekday {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            padding-bottom: 15px;
        }

        .date-cell {
            position: relative;
            height: 32px;
            width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            margin: auto;
            z-index: 1;
        }

        .is-event::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: var(--highlight-soft);
            border-radius: 50%;
            z-index: -1;
        }

        .is-today {
            border: 1.5px solid var(--highlight-today);
            border-radius: 50%;
            font-weight: 600;
        }

        .is-empty { visibility: hidden; }
    </style>
</head>
<body>

<div class="split-container">
    <div class="sidebar">
        <p class="year-text" id="displayYear"></p>
        <h1 class="month-text" id="displayMonth"></h1>
        <div class="event-list" id="eventItems"></div>
    </div>

    <div class="main-calendar">
        <div class="calendar-grid" id="calendarBoard">
            <div class="weekday">MON</div>
            <div class="weekday">TUE</div>
            <div class="weekday">WED</div>
            <div class="weekday =">THU</div>
            <div class="weekday">FRI</div>
            <div class="weekday">SAT</div>
            <div class="weekday">SUN</div>
        </div>
    </div>
</div>

<script>
    const monthLabels = ["January", "February", "March", "April", "May", "June",
                        "July", "August", "September", "October", "November", "December"];
    
    // Updated March 2026 Events
    const myEvents = [
        { d: 20, title: "Nowruz", type: "Persian New Year" },
        { d: 21, title: "Ramadan Begins", type: "Observed" },
        { d: 27, title: "Spring Break", type: "Holiday" }
    ];

    const today = new Date();
    const m = today.getMonth();
    const y = today.getFullYear();
    const d = today.getDate();

    document.getElementById('displayMonth').innerText = monthLabels[m];
    document.getElementById('displayYear').innerText = y;

    const listDiv = document.getElementById('eventItems');
    myEvents.forEach(e => {
        const row = document.createElement('div');
        row.className = 'event-row';
        row.innerHTML = `<span class="event-num">${e.d}</span>
                         <div class="event-info">
                            <span class="event-name">${e.title}</span>
                            <span class="event-tag">${e.type}</span>
                         </div>`;
        listDiv.appendChild(row);
    });

    const first = new Date(y, m, 1).getDay();
    const offset = (first === 0) ? 6 : first - 1;
    const daysCount = new Date(y, m + 1, 0).getDate();
    const board = document.getElementById('calendarBoard');
    const markedDays = myEvents.map(ev => ev.d);

    for (let i = 0; i < offset; i++) {
        const cell = document.createElement('div');
        cell.className = 'date-cell is-empty';
        board.appendChild(cell);
    }

    for (let i = 1; i <= daysCount; i++) {
        const cell = document.createElement('div');
        cell.className = 'date-cell';
        cell.innerText = i;
        if (i === d) cell.classList.add('is-today');
        else if (markedDays.includes(i)) cell.classList.add('is-event');
        board.appendChild(cell);
    }
</script>

</body>
</html>
