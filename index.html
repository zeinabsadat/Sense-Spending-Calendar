<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Aesthetic Calendar - March 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: transparent;
            --text-main: #37352f;
            --text-dim: #7a7a7a;
            --highlight-soft: #ede6dd;
            --highlight-today: #000;
            --font-serif: 'Georgia', serif;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-main: #ebebeb;
                --text-dim: #a0a0a0;
                --highlight-soft: #3f3e3c;
                --highlight-today: #fff;
            }
        }

        body {
            margin: 0;
            /* ایجاد فاصله از هر گوشه برای اینکه به دیواره‌های نوشن نچسبد */
            padding: 40px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            color: var(--text-main);
            box-sizing: border-box;
        }

        .split-container {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 50px; /* افزایش فاصله بین دو ستون */
            width: 100%;
            max-width: 600px; /* محدود کردن عرض برای تمرکز در وسط */
            align-items: start;
        }

        .sidebar {
            text-align: left;
            border-right: 1px solid rgba(122, 122, 122, 0.2);
            padding-right: 30px;
        }

        .year-text {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--text-dim);
            margin: 0;
        }

        .month-text {
            font-family: var(--font-serif);
            font-size: 3.2rem;
            margin: 8px 0 30px 0;
            font-style: italic;
            font-weight: normal;
            line-height: 1;
        }

        .event-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 0.8rem;
        }

        .event-num { font-weight: 600; min-width: 20px; }
        .event-info { display: flex; flex-direction: column; }
        .event-name { font-weight: 500; }
        .event-tag { font-size: 0.7rem; color: var(--text-dim); font-style: italic; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 15px 10px;
            text-align: center;
        }

        .weekday {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-dim);
            padding-bottom: 15px;
        }

        .date-cell {
            position: relative;
            height: 30px;
            width: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            z-index: 1;
            margin: auto;
        }

        .is-event::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            background-color: var(--highlight-soft);
            border-radius: 50%;
            z-index: -1;
        }

        .is-today {
            border: 1.2px solid var(--highlight-today);
            border-radius: 50%;
            font-weight: 600;
        }

        .is-empty { visibility: hidden; }
    </style>
</head>
<body>

<div class="split-container">
    <div class="sidebar">
        <p class="year-text">2026</p>
        <h1 class="month-text">March</h1>
        <div id="eventItems"></div>
    </div>

    <div class="main-calendar">
        <div class="calendar-grid" id="calendarBoard">
            <div class="weekday">MON</div><div class="weekday">TUE</div><div class="weekday">WED</div>
            <div class="weekday">THU</div><div class="weekday">FRI</div><div class="weekday">SAT</div>
            <div class="weekday">SUN</div>
        </div>
    </div>
</div>

<script>
    const globalEvents = [
        { d: 8,  title: "Women's Day", type: "International" },
        { d: 17, title: "St. Patrick's", type: "Cultural" },
        { d: 20, title: "Spring Equinox", type: "Global Season" },
        { d: 22, title: "World Water Day", type: "UN Observance" }
    ];

    const listDiv = document.getElementById('eventItems');
    globalEvents.forEach(e => {
        const row = document.createElement('div');
        row.className = 'event-row';
        row.innerHTML = `<span class="event-num">${e.d}</span>
                         <div class="event-info">
                            <span class="event-name">${e.title}</span>
                            <span class="event-tag">${e.type}</span>
                         </div>`;
        listDiv.appendChild(row);
    });

    const board = document.getElementById('calendarBoard');
    const today = new Date();
    const curDay = (today.getMonth() === 2 && today.getFullYear() === 2026) ? today.getDate() : -1;
    
    const offset = 6; 
    const daysInMarch = 31;
    const markedDays = globalEvents.map(ev => ev.d);

    for (let i = 0; i < offset; i++) {
        const cell = document.createElement('div');
        cell.className = 'date-cell is-empty';
        board.appendChild(cell);
    }

    for (let i = 1; i <= daysInMarch; i++) {
        const cell = document.createElement('div');
        cell.className = 'date-cell';
        cell.innerText = i;
        if (i === curDay) cell.classList.add('is-today');
        else if (markedDays.includes(i)) cell.classList.add('is-event');
        board.appendChild(cell);
    }
</script>

</body>
</html>
