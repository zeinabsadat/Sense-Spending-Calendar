<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Calendar Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: transparent;
            --text-main: #37352f;
            --text-dim: #7a7a7a;
            --highlight-soft: #ede6dd;
            --highlight-today: #000;
            --font-accent: 'Dancing Script', cursive;
            --font-main: 'Inter', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-main: #ebebeb;
                --text-dim: #a0a0a0;
                --highlight-soft: #3f3e3c;
                --highlight-today: #fff;
            }
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 95%;
            max-width: 650px;
            gap: 30px;
            align-items: flex-start;
        }

        /* Column 1: Info */
        .info-col {
            flex: 1;
            text-align: left;
            border-right: 1px solid rgba(122, 122, 122, 0.2);
            padding-right: 20px;
        }

        .year-label {
            font-size: 1rem;
            letter-spacing: 4px;
            color: var(--text-dim);
            margin: 0;
            font-weight: 300;
        }

        .month-name {
            font-family: var(--font-accent);
            font-size: 3rem;
            margin: 5px 0 25px 0;
            line-height: 1;
        }

        .event-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .event-item {
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .event-date {
            font-weight: 600;
            min-width: 20px;
            color: var(--text-main);
        }

        .event-details {
            display: flex;
            flex-direction: column;
        }

        .event-title {
            font-weight: 400;
            color: var(--text-main);
        }

        .event-type {
            font-size: 0.7rem;
            color: var(--text-dim);
            font-style: italic;
            margin-top: 2px;
        }

        /* Column 2: Calendar Grid */
        .calendar-col {
            flex: 1.3;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px 5px;
            text-align: center;
        }

        .day-header {
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-weight: 600;
            padding-bottom: 10px;
        }

        .day {
            position: relative;
            height: 30px;
            width: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            margin: auto;
            z-index: 1;
        }

        .highlight-soft::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            background-color: var(--highlight-soft);
            border-radius: 50%;
            z-index: -1;
        }

        .today {
            border: 1.2px solid var(--highlight-today);
            border-radius: 50%;
            font-weight: 600;
        }

        .empty { visibility: hidden; }
    </style>
</head>
<body>

<div class="container">
    <div class="info-col">
        <p class="year-label" id="yearLabel"></p>
        <h1 class="month-name" id="monthName"></h1>
        <div class="event-list" id="eventList">
            </div>
    </div>

    <div class="calendar-col">
        <div class="days-grid" id="daysGrid">
            <div class="day-header">MON</div>
            <div class="day-header">TUE</div>
            <div class="day-header">WED</div>
            <div class="day-header">THU</div>
            <div class="day-header">FRI</div>
            <div class="day-header">SAT</div>
            <div class="day-header">SUN</div>
        </div>
    </div>
</div>

<script>
    const months = ["January", "February", "March", "April", "May", "June",
                    "July", "August", "September", "October", "November", "December"];
    
    // Edit your events here
    const events = [
        { date: 14, title: "Valentine's Day", type: "Celebration" },
        { date: 20, title: "Spring Equinox", type: "Season Start" },
        { date: 28, title: "Project Deadline", type: "Work" }
    ];

    const d = new Date();
    const curMonth = d.getMonth();
    const curYear = d.getFullYear();
    const curDay = d.getDate();

    document.getElementById('monthName').innerText = months[curMonth];
    document.getElementById('yearLabel').innerText = curYear;

    // Build Events List
    const listEl = document.getElementById('eventList');
    events.forEach(e => {
        const item = document.createElement('div');
        item.className = 'event-item';
        item.innerHTML = `
            <span class="event-date">${e.date}</span>
            <div class="event-details">
                <span class="event-title">${e.title}</span>
                <span class="event-type">${e.type}</span>
            </div>`;
        listEl.appendChild(item);
    });

    // Build Calendar Grid
    const firstDay = new Date(curYear, curMonth, 1).getDay();
    const startOffset = (firstDay === 0) ? 6 : firstDay - 1;
    const totalDays = new Date(curYear, curMonth + 1, 0).getDate();
    const gridEl = document.getElementById('daysGrid');

    const eventDays = events.map(ev => ev.date);

    for (let i = 0; i < startOffset; i++) {
        const div = document.createElement('div');
        div.className = 'day empty';
        gridEl.appendChild(div);
    }

    for (let day = 1; day <= totalDays; day++) {
        const div = document.createElement('div');
        div.className = 'day';
        div.innerText = day;

        if (day === curDay) div.classList.add('today');
        else if (eventDays.includes(day)) div.classList.add('highlight-soft');

        gridEl.appendChild(div);
    }
</script>

</body>
</html>
