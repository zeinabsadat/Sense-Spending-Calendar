<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Split Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: transparent;
            --text-main: #37352f;
            --text-dim: #7a7a7a;
            --highlight-soft: #ede6dd;
            --highlight-today: #000;
            --font-accent: 'Dancing Script', cursive;
            --font-main: 'Inter', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-main: #ebebeb;
                --text-dim: #a0a0a0;
                --highlight-soft: #3f3e3c;
                --highlight-today: #fff;
            }
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            color: var(--text-main);
            overflow: hidden;
        }

        .split-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr; /* Explicit two-column layout */
            gap: 30px;
            width: 100%;
            max-width: 600px;
            align-items: start;
        }

        /* Left Side: Text Info */
        .sidebar {
            text-align: left;
            border-right: 1px solid rgba(122, 122, 122, 0.2);
            padding-right: 20px;
        }

        .year-text {
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--text-dim);
            margin: 0;
            text-transform: uppercase;
        }

        .month-text {
            font-family: var(--font-accent);
            font-size: 3rem;
            margin: 5px 0 20px 0;
            line-height: 1;
        }

        .event-list {
            margin-top: 15px;
        }

        .event-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.8rem;
        }

        .event-num {
            font-weight: 600;
            color: var(--text-main);
            min-width: 18px;
        }

        .event-info {
            display: flex;
            flex-direction: column;
        }

        .event-name { font-weight: 400; }
        .event-tag { 
            font-size: 0.7rem; 
            color: var(--text-dim); 
            font-style: italic;
        }

        /* Right Side: Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .weekday {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-dim);
            padding-bottom: 10px;
        }

        .date-cell {
            position: relative;
            height: 28px;
            width: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            margin: auto;
            z-index: 1;
        }

        .is-event::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            background-color: var(--highlight-soft);
            border-radius: 50%;
            z-index: -1;
        }

        .is-today {
            border: 1px solid var(--highlight-today);
            border-radius: 50%;
            font-weight: 600;
        }

        .is-empty { visibility: hidden; }
    </style>
</head>
<body>

<div class="split-container">
    <div class="sidebar">
        <p class="year-text" id="displayYear"></p>
        <h1 class="month-text" id="displayMonth"></h1>
        <div class="event-list" id="eventItems"></div>
    </div>

    <div class="main-calendar">
        <div class="calendar-grid" id="calendarBoard">
            <div class="weekday">MO</div>
            <div class="weekday">TU</div>
            <div class="weekday">WE</div>
            <div class="weekday">TH</div>
            <div class="weekday">FR</div>
            <div class="weekday">SA</div>
            <div class="weekday">SU</div>
        </div>
    </div>
</div>

<script>
    const monthLabels = ["January", "February", "March", "April", "May", "June",
                        "July", "August", "September", "October", "November", "December"];
    
    // Set your events here
    const myEvents = [
        { d: 14, title: "Valentine's", type: "Holiday" },
        { d: 21, title: "Equinox", type: "Season" },
        { d: 28, title: "Review", type: "Work" }
    ];

    const today = new Date();
    const m = today.getMonth();
    const y = today.getFullYear();
    const d = today.getDate();

    document.getElementById('displayMonth').innerText = monthLabels[m];
    document.getElementById('displayYear').innerText = y;

    // Sidebar Events
    const listDiv = document.getElementById('eventItems');
    myEvents.forEach(e => {
        const row = document.createElement('div');
        row.className = 'event-row';
        row.innerHTML = `<span class="event-num">${e.d}</span>
                         <div class="event-info">
                            <span class="event-name">${e.title}</span>
                            <span class="event-tag">${e.type}</span>
                         </div>`;
        listDiv.appendChild(row);
    });

    // Calendar logic
    const first = new Date(y, m, 1).getDay();
    const offset = (first === 0) ? 6 : first - 1;
    const daysCount = new Date(y, m + 1, 0).getDate();
    const board = document.getElementById('calendarBoard');

    const markedDays = myEvents.map(ev => ev.d);

    for (let i = 0; i < offset; i++) {
        const cell = document.createElement('div');
        cell.className = 'date-cell is-empty';
        board.appendChild(cell);
    }

    for (let i = 1; i <= daysCount; i++) {
        const cell = document.createElement('div');
        cell.className = 'date-cell';
        cell.innerText = i;

        if (i === d) cell.classList.add('is-today');
        else if (markedDays.includes(i)) cell.classList.add('is-event');

        board.appendChild(cell);
    }
</script>

</body>
</html>
